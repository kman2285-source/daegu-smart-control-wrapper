<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>대구 스마트 관제</title>

<!-- PWA manifest: 여기 이름이 홈 화면 설치 이름으로 사용됩니다 -->
<link rel="manifest" href="manifest.json">

<!-- 아이콘 -->
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">

<!-- iOS 홈 화면 설치 지원 -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="스마트 관제">

<!-- 테마 색상 -->
<meta name="theme-color" content="#1e3a8a">

<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #ffffff;
  }
  #app-frame {
    border: none;
    width: 100vw;
    height: 100vh;
    display: block;
  }
  #loading {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    background: #ffffff;
    z-index: 10;
    transition: opacity 0.3s ease;
  }
  #loading img {
    width: 72px;
    height: 72px;
  }
  #loading .spinner {
    width: 28px;
    height: 28px;
    border: 3px solid #e2e8f0;
    border-top-color: #1e3a8a;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  #loading .label {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Malgun Gothic", sans-serif;
    color: #475569;
    font-size: 14px;
  }
  @keyframes spin {
    to { transform: rotate(360deg); }
  }
</style>
</head>
<body>

<div id="loading">
  <img src="icons/icon-192.png" alt="대구 스마트 관제">
  <div class="spinner"></div>
  <div class="label">대구 스마트 관제 불러오는 중…</div>
</div>

<iframe
  id="app-frame"
  src="https://daegu-smart-infra-9qxmlqtx9persd3xdhc3bm.streamlit.app/?embed=true"
  title="대구 스마트 관제"
  allow="geolocation; camera"
  onload="document.getElementById('loading').style.opacity='0'; setTimeout(function(){document.getElementById('loading').style.display='none';}, 300);"
></iframe>

</body>
</html>
