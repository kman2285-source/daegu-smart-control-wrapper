<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>대구 스마트 관제</title>

<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="스마트 관제">
<meta name="theme-color" content="#1e3a8a">

<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #ffffff; }
  #screen {
    position: fixed; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 20px; background: #ffffff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Malgun Gothic", sans-serif;
  }
  #screen img { width: 84px; height: 84px; }
  #screen h1 { font-size: 18px; color: #1e293b; margin: 0; }
  #open-btn {
    margin-top: 8px;
    padding: 14px 36px;
    font-size: 16px;
    font-weight: 600;
    color: #ffffff;
    background: #1e3a8a;
    border: none;
    border-radius: 999px;
    cursor: pointer;
  }
  #open-btn:active { opacity: 0.85; }
</style>
</head>
<body>

<div id="screen">
  <img src="icons/icon-192.png" alt="대구 스마트 관제">
  <h1>대구 스마트 관제</h1>
  <button id="open-btn">앱 열기</button>
</div>

<script>
  var APP_URL = "https://daegu-smart-infra-9qxmlqtx9persd3xdhc3bm.streamlit.app/";
  document.getElementById("open-btn").addEventListener("click", function () {
    window.location.href = APP_URL;
  });
</script>

</body>
</html>
