<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>대구 스마트 관제</title>

<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="스마트 관제">
<meta name="theme-color" content="#1e3a8a">

<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #ffffff; }
  #screen {
    position: fixed; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 20px; background: #ffffff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Malgun Gothic", sans-serif;
  }
  #screen img { width: 84px; height: 84px; }
  #screen h1 { font-size: 18px; color: #1e293b; margin: 0; }
  #open-btn {
    margin-top: 8px;
    padding: 14px 36px;
    font-size: 16px;
    font-weight: 600;
    color: #ffffff;
    background: #1e3a8a;
    border: none;
    border-radius: 999px;
    cursor: pointer;
  }
  #open-btn:active { opacity: 0.85; }
  .spinner {
    width: 28px; height: 28px;
    border: 3px solid #e2e8f0; border-top-color: #1e3a8a;
    border-radius: 50%; animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  #screen.hidden { display: none; }
</style>
</head>
<body>

<div id="screen" class="hidden">
  <img src="icons/icon-192.png" alt="대구 스마트 관제">
  <h1>대구 스마트 관제</h1>
  <button id="open-btn">앱 열기</button>
</div>

<script>
  var APP_URL = "https://daegu-smart-infra-9qxmlqtx9persd3xdhc3bm.streamlit.app/";
  var TOKEN_KEY = "dpfc_token";

  var params = new URLSearchParams(window.location.search);
  var screenEl = document.getElementById("screen");

  function goToApp(token) {
    var url = token ? (APP_URL + "?t=" + encodeURIComponent(token)) : APP_URL;
    window.location.href = url;
  }

  function showButtonScreen() {
    screenEl.classList.remove("hidden");
    document.getElementById("open-btn").addEventListener("click", function () {
      var saved = localStorage.getItem(TOKEN_KEY);
      goToApp(saved);
    });
  }

  if (params.has("save")) {
    // 앱에서 로그인 성공 후 이리로 튕겨보낸 경우: 토큰을 저장하고 곧바로 앱으로 돌려보낸다.
    var tokenToSave = params.get("save");
    localStorage.setItem(TOKEN_KEY, tokenToSave);
    goToApp(tokenToSave);
  } else if (params.has("clear")) {
    // 앱에서 로그아웃한 경우: 저장해둔 토큰을 지우고, 버튼 화면을 보여준다.
    localStorage.removeItem(TOKEN_KEY);
    showButtonScreen();
  } else {
    var saved = localStorage.getItem(TOKEN_KEY);
    if (saved) {
      // 이미 로그인 토큰이 저장되어 있으면 버튼 없이 곧바로 앱으로 이동(로그인 유지 효과)
      goToApp(saved);
    } else {
      // 저장된 토큰이 없으면(최초 설치 등) 기존처럼 버튼을 눌러야 이동 —
      // 설치 이름이 이 래퍼 페이지 이름으로 고정되려면 이 화면에서 설치해야 하기 때문.
      showButtonScreen();
    }
  }
</script>

</body>
</html>
