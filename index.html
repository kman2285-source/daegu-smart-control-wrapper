<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>대구 스마트 관제</title>

<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="스마트 관제">
<meta name="theme-color" content="#1e3a8a">

<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #ffffff; }
  #loading { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; background: #ffffff; }
  #loading img { width: 72px; height: 72px; }
  #loading .spinner { width: 28px; height: 28px; border: 3px solid #e2e8f0; border-top-color: #1e3a8a; border-radius: 50%; animation: spin 0.8s linear infinite; }
  #loading .label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Malgun Gothic", sans-serif; color: #475569; font-size: 14px; }
  #loading .fallback { margin-top: 8px; font-size: 13px; }
  #loading .fallback a { color: #1e3a8a; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div id="loading">
  <img src="icons/icon-192.png" alt="대구 스마트 관제">
  <div class="spinner"></div>
  <div class="label">대구 스마트 관제로 이동 중…</div>
  <div class="fallback">자동으로 넘어가지 않으면 <a id="manual-link" href="#">여기를 눌러주세요</a></div>
</div>

<script>
  var APP_URL = "https://daegu-smart-infra-9qxmlqtx9persd3xdhc3bm.streamlit.app/";
  document.getElementById("manual-link").href = APP_URL;
  window.location.replace(APP_URL);
</script>

</body>
</html>
